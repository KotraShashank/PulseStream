name: Resolve audited dependency versions
on:
  push:
    branches: ["fix/**"]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve updated lockfiles
        run: |
          npm install --prefix backend --package-lock-only --ignore-scripts --no-fund --no-audit 'nodemailer@^10.6.1'
          npm audit fix --prefix backend --omit=dev --package-lock-only --ignore-scripts --no-fund || true
          npm audit fix --prefix frontend --omit=dev --package-lock-only --ignore-scripts --no-fund || true
          for path in backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json; do
            printf 'PULSE_BEGIN %s\n' "$path"
            gzip -nc "$path" | base64 --wrap=120 | sed 's/^/PULSE_DATA /'
            printf 'PULSE_END %s\n' "$path"
          done
